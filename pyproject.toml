[project]
name = "dfo-evals"
version = "0.1.0"
description = "Shared eval library for the Development Finance Observatory (DFO)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pydantic-evals>=2.66",
]

[project.optional-dependencies]
# dfo_evals.langfuse_sink alone needs these, so a suite that only writes run records
# and builds the page installs neither.
langfuse = [
    "langfuse>=5.2,<6",
    "opentelemetry-sdk>=1.42",
]
storage = ["google-cloud-storage>=3.13,<4"]

[project.scripts]
dfo-evals-page = "dfo_evals.page:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dfo-evals[langfuse]",
    "dfo-evals[storage]",
    "ruff>=0.15.0",
    "ty>=0.0.59",
    "pytest>=9.1.0",
    "pre-commit>=4.6.0",
]

[tool.ruff]
# Component suites run on 3.12 (apis) and 3.13 (ai), so the library targets the lower bound.
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F",      # pycodestyle, pyflakes
    "I",                 # isort
    "N",                 # pep8-naming
    "UP",                # pyupgrade
    "B",                 # bugbear
    "C4",                # comprehensions
    "SIM",               # simplify
    "PL",                # pylint
    "RUF",               # ruff-specific
    "ERA",               # eradicate (commented-out code)
    "PERF",              # perflint
    "ANN",               # flake8-annotations (require type hints on public APIs)
]

ignore = [
    "E501",     # Line length (formatter handles)
    "PLR0913",  # Too many arguments
    "PLR0912",  # Too many branches
    "PLR0914",  # Too many locals
    "PLR0915",  # Too many statements
    "PLR2004",  # Magic values
    "ANN401",   # Allow `Any` in typed signatures
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Tests don't need annotations or magic-value gates.
"tests/**/*.py" = ["ANN", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src"]

# importlib import mode keeps same-named test modules from colliding.
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib"
# A test still running after faulthandler_timeout seconds dumps every thread's
# stack and ends the run, so a hang fails fast instead of running on to CI's
# timeout-minutes.
faulthandler_timeout = 120
faulthandler_exit_on_timeout = true
