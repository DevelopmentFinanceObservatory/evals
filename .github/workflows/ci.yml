name: CI

on:
  # A push runs on dev only. main moves through pull requests from dev, whose
  # own runs tested the merge, so a push there runs nothing.
  push:
    branches: [dev]
  pull_request:
    # The globs cover every branch-type prefix this repository uses, because
    # stacked PRs take sibling branches as bases and this filter matches the
    # base, not the head. A PR whose base matches nothing here reports no
    # checks at all, which reads as "not yet run" rather than as a failure.
    branches:
      [
        dev,
        main,
        "feat/**",
        "fix/**",
        "perf/**",
        "refactor/**",
        "test/**",
        "docs/**",
        "build/**",
        "ci/**",
        "chore/**",
      ]
    # `edited` is left out on purpose. It would start a run on every title or
    # body edit, and the concurrency group below would cancel the real suite
    # that the edit interrupted. The cost is that a stacked PR whose base is
    # retargeted emits only `edited`, so its required checks wait on "Expected"
    # until someone re-runs them.
    # `ready_for_review` starts the run when a draft is marked ready; the jobs
    # skip while the pull request is a draft.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  # Keyed on the PR number for pull_request events, so a PR run never shares a
  # group with its base branch's push runs.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# `just check` covers the lint and test jobs below. Keep the two in sync if
# either changes.
jobs:
  lint:
    # Runs ruff and ty together, so the single `lint` check fails on a type
    # error too.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --python 3.12

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

  test:
    # Component suites run on 3.12 (apis) and 3.13 (ai), so the library tests
    # on both. The checks report as `test (3.12)` and `test (3.13)`.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_FROZEN: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Test
        run: uv run pytest

  # Consumers pin their own pydantic-ai-slim (ai is on 2.66), and each pydantic-evals
  # release pins pydantic-ai-slim exactly, so the declared lower bounds must work.
  test-lowest:
    if: >-
      github.event.pull_request.draft != true &&
      (github.event_name != 'pull_request' || github.event.pull_request.state == 'open')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install the lowest direct dependency versions
        run: uv sync --python 3.12 --resolution lowest-direct

      - name: Test
        run: uv run --no-sync pytest
